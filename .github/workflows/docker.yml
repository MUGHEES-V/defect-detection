name: docker

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t defect-api .

      - name: Start container
        run: docker run -d -p 8000:8000 --name api defect-api

      - name: Wait for API
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 1
          done
          exit 1

      - name: Test prediction
        run: |
          curl -sf -F "file=@examples/defective.jpeg" http://localhost:8000/predict | tee response.json
          grep -q '"predicted_class":"defective"' response.json

      - name: Container logs
        if: always()
        run: docker logs api
